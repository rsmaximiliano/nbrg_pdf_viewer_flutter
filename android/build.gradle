group 'dev.nbrg.nbrg_pdf_viewer_flutter'
version '2.0.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.1.2'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.nbrg.nbrg_pdf_viewer_flutter'
    compileSdkVersion 32

    defaultConfig {
        minSdkVersion 16
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

dependencies {
    // 16 KB page size-aligned fork of mhiew/android-pdf-viewer (Maven Central), needed for
    // Google Play's 16 KB memory page size policy. mhiew's own releases stopped at 3.2.0-beta.3
    // without ever shipping 16 KB-aligned native libraries.
    implementation 'io.github.oothp:android-pdf-viewer:3.2.0-beta06'
}
